<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<!--
  zipnative Open Graph / social share image (1200x630).
  Editable vector source. Rasterise to og-image.png with headless
  Chromium/Edge using a window size of 1200x630 and the screenshot flag:
    msedge ++headless ++disable-gpu ++hide-scrollbars ++window-size=1200,630
           ++screenshot=og-image.png og-image.svg
  (replace ++ with double dashes). The committed PNG is the artefact of
  record; text renders through the system font stack, so rasterise on a
  machine with Segoe UI or equivalent.
  Brand charter (shared with pdfnative): primary #2563eb, accent #1d4ed8,
  primary-dim #3b82f6 on bg #0f172a / bg-alt #1e293b.
-->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="14%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#1e293b"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Brand row: logo geometry inlined (self-contained for the rasteriser) -->
  <g transform="translate(80, 64)">
    <g transform="scale(1.85)">
      <rect x="3" y="3" width="34" height="34" rx="8" fill="url(#logo-grad)"/>
      <path d="M25.5 3h5a6 6 0 0 1 6.5 6.5V16L25.5 3z" fill="#93C5FD" opacity="0.35"/>
      <path d="M10 10h20v4.6H20.3L30 24.4V30H10v-4.6h9.7L10 15.6z" fill="#ffffff"/>
      <g fill="url(#logo-grad)">
        <path d="M21.21 17.54l2-2 2 2-2 2z"/>
        <path d="M25.09 21.46l2-2 2 2-2 2z"/>
        <path d="M12.85 20.5l2-2 2 2-2 2z"/>
        <path d="M16.73 24.42l2-2 2 2-2 2z"/>
      </g>
    </g>
    <text x="92" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="40" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">zipnative</text>
  </g>
  <text x="1120" y="106" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
        font-size="22" fill="#64748b">zipnative.dev</text>

  <!-- Headline -->
  <text x="80" y="280" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="92" font-weight="800" fill="#f8fafc" letter-spacing="-2">Native ZIP</text>
  <text x="80" y="380" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="92" font-weight="800" fill="url(#accent)" letter-spacing="-2">for TypeScript</text>

  <!-- Subtitles -->
  <text x="80" y="436" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="27" font-weight="500" fill="#e2e8f0">Safe by default · reproducible by contract · streaming by design</text>
  <text x="80" y="472" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="22" fill="#94a3b8">Zero runtime dependencies — one API across Node, browsers, Deno, Bun and Workers</text>

  <!-- Capability pills -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
     font-size="22" fill="#cbd5e1" text-anchor="middle">
    <rect x="80" y="510" width="184" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
    <text x="172" y="541">Deterministic</text>
    <rect x="280" y="510" width="140" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
    <text x="350" y="541">Zip-safe</text>
    <rect x="436" y="510" width="152" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
    <text x="512" y="541">Streaming</text>
    <rect x="604" y="510" width="172" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
    <text x="690" y="541">Incremental</text>
    <rect x="792" y="510" width="136" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
    <text x="860" y="541">Workers</text>
  </g>

  <text x="1120" y="596" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="20" fill="#475569">MIT · zero dependencies · open source</text>
</svg>
