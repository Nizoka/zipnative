<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="uci-title uci-desc" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <title id="uci-title">Untrusted-upload intake behind the default guards</title>
  <desc id="uci-desc">Architecture: a user upload, hostile until proven otherwise, flows into zipnative's extractZip with its defaults on — zip-slip, decompression bombs, symlinks, overlapping entries and Zip64 spoofing are all checked. Two branches leave the guard box: the green path, when every guard passes, yields clean path-and-data pairs joined under the caller's own root; the red path, when any guard trips, throws a typed error whose stable err.code routes the archive to quarantine with an audit log. An indigo card notes the CWE-tagged ZipLimits bounds are raised only explicitly. The closing band states the honest limit — extraction is in-memory; writing to disk is the sink's job.</desc>

  <marker id="uci-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
  <marker id="uci-ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
  </marker>
  <marker id="uci-ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
  </marker>

  <rect x="0" y="0" width="960" height="560" fill="#F8FAFC"/>

  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Untrusted-upload intake</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#64748B">The default code path is the safe one — opting out is always explicit, refusals carry stable codes</text>

  <!-- Upload (neutral) -->
  <rect x="40" y="150" width="220" height="72" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="150" y="177" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">User upload</text>
  <text x="150" y="197" text-anchor="middle" font-size="11.5" fill="#64748B">hostile until proven otherwise</text>

  <line x1="262" y1="186" x2="306" y2="186" stroke="#475569" stroke-width="1.75" marker-end="url(#uci-ah)"/>

  <!-- Guard box (cyan) -->
  <rect x="310" y="118" width="330" height="150" rx="12" fill="#ECFEFF" stroke="#5EBECF" stroke-width="1.5"/>
  <text x="475" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#155E75">extractZip(bytes) — defaults on</text>
  <rect x="326" y="160" width="298" height="92" rx="10" fill="#FFFFFF" stroke="#5EBECF" stroke-width="1.25"/>
  <text x="475" y="182" text-anchor="middle" font-size="11.5" fill="#0E7490">zip-slip (CWE-22) · symlinks (CWE-59)</text>
  <text x="475" y="200" text-anchor="middle" font-size="11.5" fill="#0E7490">bombs — ratio + output caps (CWE-400/409)</text>
  <text x="475" y="218" text-anchor="middle" font-size="11.5" fill="#0E7490">overlapping entries (CWE-405) · duplicates (CWE-694)</text>
  <text x="475" y="236" text-anchor="middle" font-size="11.5" fill="#0E7490">Zip64 spoofing (CWE-1288) · ambiguous EOCD</text>

  <!-- Green branch -->
  <path d="M642 160 C 690 150, 700 140, 706 132" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#uci-ah-green)"/>
  <text x="648" y="108" text-anchor="middle" font-size="11" fill="#64748B">passes every guard</text>
  <rect x="710" y="96" width="210" height="80" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.25"/>
  <text x="815" y="123" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Clean entries</text>
  <text x="815" y="143" text-anchor="middle" font-size="11.5" fill="#16A34A">{ path, data } — path sanitized,</text>
  <text x="815" y="159" text-anchor="middle" font-size="11.5" fill="#16A34A">joined under your own root</text>

  <!-- Red branch -->
  <path d="M642 232 C 690 242, 700 252, 706 260" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#uci-ah-red)"/>
  <text x="648" y="290" text-anchor="middle" font-size="11" fill="#64748B">any guard trips</text>
  <rect x="710" y="266" width="210" height="96" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.25"/>
  <text x="815" y="293" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991B1B">Typed refusal</text>
  <text x="815" y="313" text-anchor="middle" font-size="11.5" fill="#B91C1C">err.code: ZIP_PATH_TRAVERSAL,</text>
  <text x="815" y="329" text-anchor="middle" font-size="11.5" fill="#B91C1C">ZIP_LIMIT_EXCEEDED, ZIP_ENTRY_OVERLAP…</text>
  <text x="815" y="345" text-anchor="middle" font-size="11.5" fill="#B91C1C">→ quarantine + audit log</text>

  <!-- Limits card (indigo) -->
  <rect x="310" y="300" width="330" height="72" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.25"/>
  <text x="475" y="327" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730A3">ZipLimits — every bound named and CWE-tagged</text>
  <text x="475" y="347" text-anchor="middle" font-size="11.5" fill="#4F46E5">raising one is an explicit decision, never a silent default</text>
  <line x1="475" y1="298" x2="475" y2="272" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#uci-ah)"/>

  <!-- guarantees band (green) -->
  <rect x="40" y="398" width="880" height="56" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="480" y="422" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">A traversal-capable path is never emitted — even with rejectTraversal: false it is skipped, not surfaced.</text>
  <text x="480" y="442" text-anchor="middle" font-size="12.5" fill="#16A34A">Overlap detection and Zip64 cross-checks are always on: they have no opt-out at all.</text>

  <!-- limits band (slate) -->
  <rect x="40" y="470" width="880" height="56" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="494" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">Honest limits: extraction is in-memory — the engine never touches a filesystem.</text>
  <text x="480" y="514" text-anchor="middle" font-size="12.5" fill="#475569">Writing to disk is your sink's job; sanitizeEntryPath() is exported for external sinks that need the same rules.</text>
</svg>
