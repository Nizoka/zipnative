# Documentation integrity gate.
#
# ci.yml runs the hermetic `verify:docs` step inside the gate on every push
# and pull request; this workflow is the documentation-focused twin that
# also type-checks the scripts and, on a weekly schedule, goes online to
# compare the manifest (docs/assets/ecosystem.json, the single source of
# truth for every version, count and inventory quoted anywhere in the tree)
# against the npm registry — so a published release the docs have not
# caught up with surfaces on its own rather than at the next audit.
name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - '**.md'
      - 'docs/**'
      - 'llms.txt'
      - 'recipes/**'
      - 'bench/**'
      - 'package.json'
      - 'CITATION.cff'
      - 'scripts/verify-docs.ts'
      - 'scripts/build-llms-full.ts'
      - 'scripts/build-guides.ts'
      - 'scripts/build-api-json.ts'
      - '.github/workflows/docs.yml'
      # The api-json-sync / error-parity rules cross-check documented
      # identifiers against src/, so a rename there can break the docs
      # without touching them.
      - 'src/**'
  pull_request:
    branches: [main, master]
    paths:
      - '**.md'
      - 'docs/**'
      - 'llms.txt'
      - 'recipes/**'
      - 'bench/**'
      - 'package.json'
      - 'CITATION.cff'
      - 'scripts/verify-docs.ts'
      - 'scripts/build-llms-full.ts'
      - 'scripts/build-guides.ts'
      - 'scripts/build-api-json.ts'
      - '.github/workflows/docs.yml'
      - 'src/**'
  schedule:
    # Weekly npm-registry drift check (only the scheduled run goes online,
    # so a mid-PR release never reddens someone else's PR).
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify documentation consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check scripts
        run: npm run typecheck:scripts

      # No build step: the playgrounds load the published package from a
      # version-pinned CDN (rule cdn-pin), so nothing here needs dist/.
      - name: Verify documentation (hermetic)
        run: npm run verify:docs

  npm-drift:
    name: Check the manifest against npm
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify documentation against the npm registry
        run: npm run verify:docs -- --online --strict
