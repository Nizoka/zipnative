name: Sample Regression

# Guards the whole writer pipeline against unintended output changes.
# Regenerates every sample archive from the current source and fingerprints
# it against the committed chain at tests/regression/baselines/samples.sha256.json.
#
# The baseline is a CHAIN, not a snapshot: every entry records the release its
# reference was captured at (`since`) and keeps it across rebaselines, so
# 1.1.0 is still held to the bytes v1.0.0 emitted. Samples introduced by the
# release under development have no earlier reference and are reported without
# failing (`--strict` opts into failing on those too).
#
# Every sample is compared byte-for-byte: the writer is deterministic by
# contract and scripts/helpers/tz.ts pins TZ=UTC, which makes the corpus a
# pure function of its inputs on every host.
#
# ── Why there is no `paths:` filter ──────────────────────────────────
# This job is meant to be a REQUIRED status check. A path-filtered workflow
# simply does not run on a pull request that touches none of its paths, and a
# required check that never reports leaves the pull request stuck on
# "Expected — waiting for status to be reported", forever unmergeable. So the
# workflow always runs and decides internally whether the expensive work is
# warranted, which keeps the check reported on every pull request.
#
# Blocking on merge is a repository setting, not a file: "sample-regression"
# is listed in .github/rulesets/main.json; the maintainer applies that ruleset
# in Settings → Rules. Without it, a failure shows a red cross but does not
# prevent merge.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sample-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Needed to diff against the pull request's base commit.
          fetch-depth: 0

      - name: Decide whether emitted output can have changed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${BASE_SHA}"
          if git diff --name-only "$base"...HEAD \
            | grep -Eq '^(src/|scripts/|tests/regression/|package\.json$|package-lock\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo 'No change under src/, scripts/ or the manifests — emitted output cannot have changed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci --ignore-scripts

      - name: Generate samples
        if: steps.scope.outputs.run == 'true'
        run: npm run test:generate

      - name: Verify samples against the baseline chain
        if: steps.scope.outputs.run == 'true'
        run: npx tsx scripts/verify-samples.ts

      - name: Report divergences
        if: failure() && steps.scope.outputs.run == 'true'
        run: |
          {
            echo '## Sample regression'
            echo
            echo 'A tracked sample no longer emits what its reference release emitted.'
            echo 'If the change is intended, say so in the release notes and rebaseline with:'
            echo
            echo '```'
            echo 'npm run test:generate && npx tsx scripts/verify-samples.ts --update'
            echo '```'
            echo
            echo '```json'
            npx tsx scripts/verify-samples.ts --json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diverged samples on failure
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sample-regression-output
          path: test-output/
          retention-days: 7
