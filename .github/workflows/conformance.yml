# Conformance gate — zipnative's analogue of pdfnative's veraPDF gate,
# in two layers:
#
#   1. ISO/IEC 21320-1:2015 profile validation (scripts/validate-zip.ts)
#      — the sample corpus is regenerated and every archive is checked
#      clause by clause against the ISO-standardised ZIP profile by an
#      independent raw parser (never the engine's own), plus a foreign
#      integrity pass. Declared-hostile archives MUST fail. BLOCKING
#      since v1.0.0.
#   2. The differential-extraction matrix (scripts/run-interop.ts) —
#      every archive zipnative generates must be accepted, extracted and
#      byte-compared by the mainstream extractors real users run, in
#      both directions (zipnative also reads foreign producers).
#      BLOCKING since M2 (v0.2.0).
#
# Tool versions are echoed into the job summary first, so a failure is
# attributable to "our bug" vs "runner image tool drift".
name: Conformance

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/run-interop.ts'
      - 'scripts/validate-zip.ts'
      - 'scripts/generate-samples.ts'
      - 'scripts/generators/**'
      - '.github/workflows/conformance.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/run-interop.ts'
      - 'scripts/validate-zip.ts'
      - 'scripts/generate-samples.ts'
      - 'scripts/generators/**'
      - '.github/workflows/conformance.yml'

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record tool versions
        run: |
          {
            echo '## Interop tool versions (ubuntu-latest)'
            echo '```'
            unzip -v | head -1 || true
            7z i | head -3 || true
            python3 --version || true
            java -version 2>&1 | head -1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the sample corpus
        run: npm run test:generate

      - name: Validate ISO/IEC 21320-1 conformance (blocking)
        run: npm run validate:zip

      - name: Run interop matrix
        run: npm run test:interop

  interop-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record tool versions
        shell: pwsh
        run: |
          "## Interop tool versions (windows-latest)" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          & "C:\Program Files\7-Zip\7z.exe" i | Select-Object -First 3 >> $env:GITHUB_STEP_SUMMARY
          tar.exe --version | Select-Object -First 1 >> $env:GITHUB_STEP_SUMMARY
          java -version 2>&1 | Select-Object -First 1 >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Generate the sample corpus
        run: npm run test:generate

      - name: Validate ISO/IEC 21320-1 conformance (blocking)
        run: npm run validate:zip

      - name: Run interop matrix
        run: npm run test:interop
