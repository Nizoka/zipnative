name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/index.d.cts
          test -f dist/worker/index.js
          test -f dist/worker/zip-worker.js

      # Real node:worker_threads against the built worker bundle — this
      # suite self-skips when dist/ is absent, so it must run post-build.
      - name: Worker integration (real threads, post-build)
        run: npx vitest run tests/worker/worker-integration.test.ts

      # --profile node16: legacy node10 (pre-"exports") resolution cannot
      # see subpath exports like ./worker; engines require Node >= 22.
      # --ignore-rules cjs-resolves-to-esm: ./worker/zip-worker.js is the
      # ESM-only worker SCRIPT — loaded by URL, never require()d; the
      # subpath exists so bundlers/import.meta.resolve can locate it.
      - name: Check package exports (attw + publint)
        run: |
          npx attw --pack . --profile node16 --ignore-rules cjs-resolves-to-esm
          npx publint

  # A ZIP library lives or dies on Windows correctness: path separators,
  # CRLF fixture corruption, case-insensitive filesystems, reserved names.
  # This job is blocking from day one — any "skip on win32" needs a linked issue.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Worker integration (real threads, post-build)
        run: npx vitest run tests/worker/worker-integration.test.ts
