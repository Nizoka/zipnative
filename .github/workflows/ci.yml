name: CI

# The `ci` job runs `scripts/gate.ts --ci`, the single definition of "green":
# the step list lives in that file's STEPS table (typecheck:all, lint, build,
# dist-check, dist-probe, test:coverage, check:package, verify:docs,
# test:generate, verify:samples, validate:zip) and is not repeated here, so
# CI and the contributor loop cannot drift apart. `--require-all` turns any
# SKIP into a FAIL: a runner missing a tool goes red instead of quietly
# passing.
#
# `npm audit` runs outside the gate on purpose: the gate is hermetic (no
# network) so its verdict is the same on a laptop and on a runner. The
# foreign-tool interop matrix has its own workflow (conformance.yml) and
# runs again in the publish profile.
#
# No `paths-ignore`: the job ids below are required status checks
# (.github/rulesets/main.json), and a required check that never reports
# leaves a documentation-only pull request stuck on "Expected — waiting for
# status". docs.yml keeps its own path filter because it is not required.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job ids and the matrices are load-bearing: the main ruleset requires
  # the status checks `ci (22)`, `ci (24)`, `os (windows-latest)` and
  # `os (macos-latest)` (.github/rulesets/main.json).
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # No lifecycle script of any dependency runs on the runner; the
      # repository's own .npmrc says the same for every developer machine.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run the quality gate (CI profile)
        run: npx tsx scripts/gate.ts --ci --require-all

      - name: Upload the gate logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-logs-node${{ matrix.node-version }}
          path: test-output/.gate/
          retention-days: 7
          if-no-files-found: ignore

  # A ZIP library lives or dies on Windows correctness: path separators,
  # CRLF fixture corruption, case-insensitive filesystems, reserved names —
  # and macOS is where most contributors and a large share of users run. The
  # same gate runs on both, on the pinned Node line: coverage, the package
  # checks, the docs rules and the 33-sample byte baseline — which is how
  # the "byte-identical on every host" promise is proven on three operating
  # systems rather than asserted on one. Both matrix entries are required
  # status checks (.github/rulesets/main.json).
  #
  # harden-runner supports Windows runners in audit mode only, so this job
  # can never move to `egress-policy: block`; the action does not support
  # macOS at all, so the step is skipped there (`if: runner.os != 'macOS'`) —
  # the one documented exemption to "every job starts with harden-runner".
  os:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Harden the runner
        if: runner.os != 'macOS'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The same gate as the Linux matrix; `npm audit` stays on Linux (network,
      # once is enough). The gate builds before the suites that need dist/.
      - name: Run the quality gate (CI profile)
        run: npx tsx scripts/gate.ts --ci --require-all

      - name: Upload the gate logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-logs-${{ matrix.os }}
          path: test-output/.gate/
          retention-days: 7
          if-no-files-found: ignore

  # Zero breaking changes, proven: the PREVIOUS release's own test suite,
  # exactly as tagged, runs against today's src/ (scripts/run-compat.ts).
  # Only the files listed in tests/compat/allow-<version>.json are skipped,
  # each with a reason and — for a behaviour change — the compatibility
  # ledger entry of the release note. A required status check
  # (.github/rulesets/main.json); the publish gate repeats it.
  compat-previous:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The previous tag only — anonymously (the repository is public), so the
      # checkout above can keep its credentials off the runner.
      - name: Fetch the previous release tag
        run: |
          TAG=$(node -e "console.log(JSON.parse(require('fs').readFileSync(require('fs').readdirSync('tests/compat').filter(f => /^allow-/.test(f)).map(f => 'tests/compat/' + f).sort().pop(), 'utf8')).tag)")
          git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run the previous release's test suite against the current sources
        run: npm run compat:previous
