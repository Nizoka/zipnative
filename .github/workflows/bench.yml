# Benchmark trend archive — NEVER a gate.
#
# Shared runners exhibit 2-5x run-to-run variance, so a blocking perf
# threshold either fires false-red weekly or is too loose to catch real
# regressions (bench/README.md records the policy). This workflow only
# archives results on a schedule for human trend review; the per-minor
# reference numbers live in bench/RESULTS.md, refreshed on a documented
# machine at release time.
name: Bench (trend, non-blocking)

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run benchmarks
        run: npx vitest bench --run 2>&1 | tee bench-results.txt

      - name: Upload results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results-${{ github.run_number }}
          path: bench-results.txt
          retention-days: 90
